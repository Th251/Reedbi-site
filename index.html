    function StoreProvider({ children }) {
      const [route, setRoute] = useState({ name: 'home', params: {} });
      const [cart, setCart] = useState(() => load('reedbi_cart', []));
      const [wishlist, setWishlist] = useState(() => load('reedbi_wishlist', []));
      const [toast, setToast] = useState(null);
      const [search, setSearch] = useState('');

      useEffect(() => save('reedbi_cart', cart), [cart]);
      useEffect(() => save('reedbi_wishlist', wishlist), [wishlist]);

      function go(name, params = {}) {
        setRoute({ name, params });
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
      function notify(msg) {
        setToast(msg);
        clearTimeout(window.__t);
        window.__t = setTimeout(() => setToast(null), 2200);
      }
      function addToCart(product, opts = {}) {
        setCart(prev => {
          const found = prev.find(i => i.id === product.id && i.size === (opts.size || null));
          if (found) return prev.map(i => i === found ? { ...i, qty: Math.min(i.qty + 1, i.stock || 10) } : i);
          return [...prev, { ...product, qty: 1, size: opts.size || (product.sizes ? product.sizes[0] : null) }];
        });
        notify('Added to bag');
      }
      function removeFromCart(id, size = null) {
        setCart(prev => prev.filter(i => !(i.id === id && i.size === size)));
      }
      function updateQty(id, size, delta) {
        setCart(prev => prev.map(i =>
          (i.id === id && i.size === size)
            ? { ...i, qty: Math.max(1, Math.min(i.qty + delta, i.stock || 10)) }
            : i));
      }
      function toggleWish(product) {
        setWishlist(prev => {
          const exists = prev.find(p => p.id === product.id);
          if (exists) { notify('Removed from wishlist'); return prev.filter(p => p.id !== product.id); }
          notify('Saved to wishlist'); return [...prev, product];
        });
      }
      const cartCount = cart.reduce((s, i) => s + i.qty, 0);
      const inWish = (id) => wishlist.some(p => p.id === id);

      const value = { route, go, cart, setCart, cartCount, addToCart, removeFromCart, updateQty,
        wishlist, toggleWish, inWish, toast, notify, search, setSearch };
      return <AppCtx.Provider value={value}>{children}</AppCtx.Provider>;
    }
    function load(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }

    function Products() {
      const { route, search } = useStore();
      const [sortBy, setSortBy] = useState('popularity');
      const [view, setView] = useState('grid');
      const [sel, setSel] = useState({ brands: [], price: null });
      const [showFilters, setShowFilters] = useState(false);
      const q = (route.params.q ?? search ?? '').toLowerCase();
      const category = route.params.category;

      const list = useMemo(() => {
        let r = [...PRODUCTS];
        if (q) r = r.filter(p => (p.name+p.brand+p.category).toLowerCase().includes(q));
        if (category && MEGA_MENU[category]) r = r.filter(p => p.category===category || category==='More');
        else if (category) r = r.filter(p => p.category===category);
        if (sel.brands.length) r = r.filter(p => sel.brands.includes(p.brand));
        if (sel.price) r = r.filter(p => p.price>=sel.price.min && p.price<=sel.price.max);
        switch(sortBy){
          case 'priceLow': r.sort((a,b)=>a.price-b.price); break;
          case 'priceHigh': r.sort((a,b)=>b.price-a.price); break;
          case 'discount': r.sort((a,b)=>b.discount-a.discount); break;
          case 'rating': r.sort((a,b)=>b.rating-a.rating); break;
          default: r.sort((a,b)=>b.reviews-a.reviews);
        }
        return r;
      }, [q, category, sel, sortBy]);

      const toggleBrand = (b) => setSel(s => ({...s, brands: s.brands.includes(b) ? s.brands.filter(x=>x!==b) : [...s.brands, b]}));

      const Sidebar = () => (

    /* ===================================================================
       CART
    =================================================================== */
    function Cart() {
      const { cart, updateQty, removeFromCart, toggleWish, go } = useStore();
      const [coupon, setCoupon] = useState('');
      const [applied, setApplied] = useState(null);
      const [gift, setGift] = useState(false);
      const GIFT = 25;

      const active = cart.filter(i => !i.outOfStock);
      const totalMRP = active.reduce((s,i)=>s + i.originalPrice*i.qty, 0);
      const subtotal = active.reduce((s,i)=>s + i.price*i.qty, 0);
      const bagDiscount = totalMRP - subtotal;
      let couponDiscount = 0;
      if (applied) { const v = COUPONS[applied]; couponDiscount = v < 1 ? Math.round(subtotal*v) : v; }
      const shipping = subtotal > 500 ? 0 : (subtotal>0?49:0);
      const total = Math.max(0, subtotal - couponDiscount + shipping + (gift?GIFT:0));

      function apply() {
        const c = coupon.trim().toUpperCase();
        if (COUPONS[c]) { setApplied(c); } else { alert('Invalid coupon. Try REEDBI10, FIRST50 or SAVE200'); }
      }

      const steps = ['Bag','Address','Payment'];

      if (cart.length === 0) return (
        <div className="mx-auto max-w-md px-4 py-24 text-center fade-up">
          <div className="mx-auto grid h-24 w-24 place-items-center rounded-full bg-white shadow-soft"><ShoppingBag size={40} className="text-gray-300" /></div>
          <h2 className="mt-5 font-display text-2xl font-extrabold">Your bag is empty</h2>
          <p className="mt-1 text-sm text-muted">Looks like you haven't added anything yet.</p>
          <button onClick={()=>go('products')} className="mt-5 rounded-md bg-brand px-8 py-3 text-sm font-bold uppercase text-white">Continue Shopping</button>
        </div>
      );

      return (
        <div className="mx-auto max-w-[1100px] px-4 py-6 md:px-6 fade-up">
          <div className="mx-auto mb-6 flex max-w-md items-center justify-center gap-2">
            {steps.map((s,i)=>(
              <React.Fragment key={s}>
                <span className={`flex items-center gap-1.5 text-sm font-semibold ${i===0?'text-brand':'text-muted'}`}>
                  <span className={`grid h-6 w-6 place-items-center rounded-full text-xs ${i===0?'bg-brand text-white':'bg-gray-200'}`}>{i+1}</span>{s}
                </span>
                {i<steps.length-1 && <span className="h-px w-8 bg-gray-200" />}
              </React.Fragment>
            ))}
          </div>

          <div className="grid gap-5 md:grid-cols-[1fr_360px]">
            <div className="space-y-3">
              <div className="rounded-xl bg-white p-4 shadow-soft">
                <p className="text-sm font-bold">{active.reduce((s,i)=>s+i.qty,0)} item(s) in your bag</p>
              </div>
              {cart.map(item=>(
                <div key={item.id+'-'+item.size} className={`flex gap-4 rounded-xl bg-white p-4 shadow-soft ${item.outOfStock?'opacity-70':''}`}>
                  <img src={item.image} className="h-28 w-24 flex-shrink-0 rounded-lg object-cover" alt={item.name} />
                  <div className="flex flex-1 flex-col">
                    <div className="flex items-start justify-between">
                      <div>
                        <p className="text-sm font-bold">{item.brand}</p>
                        <p className="text-[13px] text-muted">{item.name}</p>
                        <p className="mt-1 text-xs text-muted">Sold by: {item.seller}</p>
                        <div className="mt-1.5 flex gap-3 text-xs text-muted">
                          {item.size && <span>Size: <b className="text-ink">{item.size}</b></span>}
                          {item.color && <span>Color: <b className="text-ink">{item.color}</b></span>}
                        </div>
                      </div>
                      <button onClick={()=>removeFromCart(item.id, item.size)} className="text-muted hover:text-brand"><X size={18} /></button>
                    </div>
                    {item.outOfStock ? (
                      <span className="mt-2 inline-block w-fit rounded bg-red-50 px-2 py-1 text-xs font-semibold text-red-500">Out of stock</span>
                    ) : (
                      <div className="mt-auto flex items-center justify-between pt-2">
                        <div className="flex items-center gap-3">
                          <div className="flex items-center rounded-full border border-gray-200">
                            <button onClick={()=>updateQty(item.id,item.size,-1)} disabled={item.qty<=1} className="grid h-8 w-8 place-items-center disabled:opacity-40"><Minus size={13} /></button>
                            <span className="w-6 text-center text-sm font-semibold">{item.qty}</span>
                            <button onClick={()=>updateQty(item.id,item.size,1)} disabled={item.qty>=item.stock} className="grid h-8 w-8 place-items-center disabled:opacity-40"><Plus size={13} /></button>
                          </div>
                          <button onClick={()=>{toggleWish(item);removeFromCart(item.id,item.size);}} className="flex items-center gap-1 text-xs font-semibold text-muted hover:text-brand"><Heart size={13} /> Wishlist</button>
                        </div>
                        <div className="text-right">
                          <p className="text-sm font-bold">{INR(item.price*item.qty)}</p>
                          <p className="text-xs text-muted line-through">{INR(item.originalPrice*item.qty)}</p>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              ))}
            </div>

            {/* summary */}
            <div className="space-y-3">
              <div className="rounded-xl bg-white p-5 shadow-soft">
                <p className="mb-3 text-xs font-bold uppercase tracking-wide text-muted">Coupons</p>
                {applied ? (
                  <div className="flex items-center justify-between rounded-lg bg-accent/10 p-3">
                    <span className="flex items-center gap-2 text-sm font-semibold text-accent"><Tag size={15} /> {applied} applied</span>
                    <button onClick={()=>setApplied(null)} className="text-xs font-semibold text-brand">Remove</button>
                  </div>
                ) : (
                  <div className="flex gap-2">
                    <input value={coupon} onChange={e=>setCoupon(e.target.value)} placeholder="Enter coupon code"
                           className="flex-1 rounded-md border border-gray-200 px-3 py-2 text-sm outline-none focus:border-brand" />
                    <button onClick={apply} className="rounded-md bg-ink px-4 text-sm font-bold text-white">Apply</button>
                  </div>
                )}
                <p className="mt-2 text-xs text-muted">Try: REEDBI10 · FIRST50 · SAVE200</p>
              </div>

              <div className="rounded-xl bg-white p-5 shadow-soft">
                <p className="mb-3 text-xs font-bold uppercase tracking-wide text-muted">Price Details</p>
                <Row label="Total MRP" value={INR(totalMRP)} />
                <Row label="Bag Discount" value={'− '+INR(bagDiscount)} green />
                {couponDiscount>0 && <Row label="Coupon Discount" value={'− '+INR(couponDiscount)} green />}
                <Row label="Shipping" value={shipping===0?'FREE':INR(shipping)} green={shipping===0} />
                <label className="flex cursor-pointer items-center justify-between border-t border-gray-100 py-2.5 text-sm">
                  <span className="flex items-center gap-2"><Gift size={15} className="text-brand" /> Gift wrap (+{INR(GIFT)})</span>
                  <input type="checkbox" checked={gift} onChange={()=>setGift(!gift)} className="accent-brand" />
                </label>
                <div className="my-1 h-px bg-gray-100" />
                <div className="flex items-center justify-between py-2 text-base font-extrabold"><span>Total Amount</span><span>{INR(total)}</span></div>
                <button onClick={()=>{alert('Demo checkout — order placed! 🎉');}} className="mt-2 w-full rounded-md bg-brand py-3.5 text-sm font-bold uppercase tracking-wide text-white transition hover:bg-brand-dark">Place Order</button>
                <p className="mt-2 flex items-center justify-center gap-1 text-xs text-muted"><Shield size={12} /> 100% secure payments</p>
              </div>
            </div>
          </div>
        </div>
      );
    }
    const Row = ({label,value,green}) => (
      <div className="flex items-center justify-between py-1.5 text-sm">
        <span className="text-muted">{label}</span>
        <span className={green?'font-semibold text-accent':'font-semibold text-ink'}>{value}</span>
      </div>
    );

      ];
      return (
        <div className="space-y-5">
          <div className="rounded-xl bg-gradient-to-r from-ink to-[#3a3f55] p-6 text-white shadow-soft">
            <p className="text-sm text-white/70">Welcome back,</p>
            <h2 className="font-display text-2xl font-extrabold">{USER.name}</h2>
            <p className="mt-1 text-xs text-white/60">{USER.member}</p>
          </div>
          <div className="grid grid-cols-2 gap-3 sm:grid-cols-4">
            {stats.map(s=>(
              <button key={s.label} onClick={()=>s.label==='Orders'?onTab('orders'):s.label==='Addresses'?onTab('addresses'):null}
                      className="rounded-xl bg-white p-4 text-left shadow-soft transition hover:-translate-y-0.5">
                <s.icon size={20} className="text-brand" />
                <p className="mt-2 text-xl font-extrabold">{s.value}</p>
                <p className="text-xs text-muted">{s.label}</p>
              </button>
            ))}
          </div>
          <div className="rounded-xl bg-white p-5 shadow-soft">
            <h3 className="mb-3 text-sm font-bold uppercase tracking-wide text-muted">Recent Order</h3>
            <OrderItem order={ORDERS[0]} compact />
          </div>
        </div>
      );
    }
    function AccountOrders() {
      return (
        <div className="space-y-4">
          <h2 className="font-display text-xl font-extrabold">My Orders</h2>
          {ORDERS.map(o=><div key={o.orderId} className="rounded-xl bg-white p-5 shadow-soft"><OrderItem order={o} /></div>)}
        </div>
      );
    }
    function OrderItem({order, compact}) {
      const ok = order.status==='Delivered';
      return (
        <div>
          <div className="mb-3 flex items-center justify-between text-xs">
            <span className="text-muted">{order.orderId} · {order.date}</span>
            <span className={`flex items-center gap-1 font-semibold ${ok?'text-accent':'text-amber-600'}`}>
              {ok?<CheckCircle2 size={13} />:<Clock size={13} />} {order.status}
            </span>
          </div>
          {order.items.map((it,i)=>(
            <div key={i} className="flex items-center gap-3">
              <img src={it.image} className="h-14 w-12 rounded-lg object-cover" alt="" />
              <div className="flex-1"><p className="text-sm font-semibold">{it.name}</p><p className="text-xs text-muted">Qty {it.qty} · {it.status}</p></div>
              <p className="text-sm font-bold">{INR(it.price)}</p>
            </div>
          ))}
          {!compact && (
            <div className="mt-3 flex gap-2 border-t border-gray-100 pt-3">
              <button className="rounded-md border border-gray-200 px-4 py-1.5 text-xs font-semibold">Track</button>
              <button className="rounded-md border border-gray-200 px-4 py-1.5 text-xs font-semibold">Invoice</button>
              {ok && <button className="rounded-md border border-brand px-4 py-1.5 text-xs font-semibold text-brand">Return</button>}
            </div>
          )}
        </div>
      );
    }
    function AccountAddresses() {
      const [list, setList] = useState(ADDRESSES);
      return (
        <div className="space-y-4">
          <div className="flex items-center justify-between">
            <h2 className="font-display text-xl font-extrabold">Saved Addresses</h2>
            <button onClick={()=>alert('Demo: add-address form')} className="flex items-center gap-1 rounded-md bg-brand px-3 py-2 text-xs font-bold text-white"><Plus size={14} /> Add New</button>
          </div>
          {list.map(a=>(
            <div key={a.id} className="rounded-xl bg-white p-5 shadow-soft">
              <div className="flex items-center gap-2">
                <span className="rounded bg-gray-100 px-2 py-0.5 text-[10px] font-bold uppercase text-muted">{a.type}</span>
                {a.default && <span className="rounded bg-accent/10 px-2 py-0.5 text-[10px] font-bold uppercase text-accent">Default</span>}
              </div>
              <p className="mt-2 text-sm font-bold">{a.name}</p>
              <p className="text-sm text-muted">{a.line}</p>
              <p className="mt-1 text-sm text-muted">Mobile: {a.phone}</p>
              <div className="mt-3 flex gap-3 text-xs font-semibold text-brand">
                <button>Edit</button>
                {!a.default && <button onClick={()=>setList(l=>l.map(x=>({...x,default:x.id===a.id})))}>Set as default</button>}
                {!a.default && <button onClick={()=>setList(l=>l.filter(x=>x.id!==a.id))} className="text-red-500">Remove</button>}
              </div>
            </div>
          ))}
        </div>
      );
    }
    function AccountSettings() {
      const [notif, setNotif] = useState(true);
      const [promo, setPromo] = useState(false);
      const Toggle = ({on,set,label,desc}) => (
        <label className="flex cursor-pointer items-center justify-between py-3">
          <div><p className="text-sm font-semibold">{label}</p><p className="text-xs text-muted">{desc}</p></div>
          <button onClick={()=>set(!on)} className={`relative h-6 w-11 rounded-full transition ${on?'bg-brand':'bg-gray-300'}`}>
            <span className={`absolute top-0.5 h-5 w-5 rounded-full bg-white transition ${on?'left-[22px]':'left-0.5'}`} />
          </button>
        </label>
      );
      return (
        <div className="space-y-4">
          <h2 className="font-display text-xl font-extrabold">Settings</h2>
          <div className="rounded-xl bg-white p-5 shadow-soft">
            <h3 className="mb-2 text-sm font-bold uppercase tracking-wide text-muted">Profile</h3>
            {[['Full Name',USER.name],['Email',USER.email],['Phone',USER.phone]].map(([k,v])=>(
              <div key={k} className="flex items-center justify-between border-b border-gray-50 py-2.5 text-sm last:border-0">
                <span className="text-muted">{k}</span><span className="font-semibold">{v}</span>
              </div>
            ))}
          </div>
          <div className="rounded-xl bg-white p-5 shadow-soft">
            <h3 className="mb-1 text-sm font-bold uppercase tracking-wide text-muted">Notifications</h3>
            <Toggle on={notif} set={setNotif} label="Order updates" desc="Get notified about your orders" />
            <Toggle on={promo} set={setPromo} label="Promotions & offers" desc="Deals, discounts and coupons" />
          </div>
        </div>
      );
    }

    /* ===================================================================
       SELLER
    =================================================================== */
    function Seller() {
      const { go } = useStore();
      const [tab, setTab] = useState('products');
      const sp = PRODUCTS.filter(p => p.seller === SELLER.name);
      const stats = [
        { label:'Rating', value:SELLER.rating, icon:Star },
        { label:'Products', value:SELLER.totalProducts, icon:Package },
        { label:'Sales', value:SELLER.totalSales, icon:Award },
        { label:'Since', value:SELLER.joined, icon:Clock },
      ];
      return (
        <div className="fade-up">
          <div className="relative h-40 overflow-hidden bg-ink md:h-56">
            <img src={SELLER.banner} className="h-full w-full object-cover opacity-70" alt="" />
            <div className="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent" />
          </div>
          <div className="mx-auto max-w-[1100px] px-4 md:px-6">
            <div className="-mt-12 flex flex-col items-start gap-4 md:flex-row md:items-end">
              <img src={SELLER.logo} className="h-24 w-24 rounded-2xl border-4 border-white object-cover shadow-lg" alt="" />
              <div className="flex-1 pb-1">
                <div className="flex items-center gap-2">
                  <h1 className="font-display text-2xl font-extrabold">{SELLER.name}</h1>
                  {SELLER.verified && <BadgeCheck size={20} className="text-accent" />}
                </div>
                <p className="flex items-center gap-1 text-sm text-muted"><MapPin size={13} /> {SELLER.location} · {SELLER.followers} followers</p>
              </div>
              <button className="rounded-md bg-brand px-6 py-2.5 text-sm font-bold text-white">+ Follow</button>
            </div>

            <div className="mt-5 grid grid-cols-4 gap-3">
              {stats.map(s=>(
                <div key={s.label} className="rounded-xl bg-white p-3 text-center shadow-soft">
                  <s.icon size={16} className="mx-auto text-brand" />
                  <p className="mt-1 text-lg font-extrabold">{s.value}</p>
                  <p className="text-[11px] text-muted">{s.label}</p>
                </div>
              ))}
            </div>

            <div className="mt-6 flex gap-6 border-b border-gray-200">
              {['products','about','reviews'].map(t=>(
                <button key={t} onClick={()=>setTab(t)} className={`-mb-px border-b-2 pb-3 text-sm font-bold uppercase tracking-wide ${tab===t?'border-brand text-brand':'border-transparent text-muted'}`}>{t}</button>
              ))}
            </div>

            <div className="py-6">
              {tab==='products' && (sp.length?<div className="grid grid-cols-2 gap-3 md:grid-cols-4 md:gap-4">{sp.map(p=><ProductCard key={p.id} p={p} />)}</div>:<p className="text-sm text-muted">No products listed.</p>)}
              {tab==='about' && (
                <div className="max-w-2xl space-y-4 rounded-xl bg-white p-6 shadow-soft">
                  <p className="text-sm leading-relaxed text-ink/80">{SELLER.description}</p>
                  <div className="grid gap-3 sm:grid-cols-2">
                    <p className="flex items-center gap-2 text-sm"><Mail size={15} className="text-brand" /> {SELLER.contact.email}</p>
                    <p className="flex items-center gap-2 text-sm"><Phone size={15} className="text-brand" /> {SELLER.contact.phone}</p>
                  </div>
                  <div className="flex flex-wrap gap-2">
                    {SELLER.categories.map(c=><span key={c} className="rounded-full bg-[#f5f5f6] px-3 py-1 text-xs font-semibold">{c}</span>)}
                  </div>
                </div>
              )}
              {tab==='reviews' && (
                <div className="max-w-2xl space-y-3">
                  {REVIEWS.map(r=>(
                    <div key={r.id} className="rounded-xl bg-white p-4 shadow-soft">
                      <div className="flex items-center justify-between"><Stars value={r.rating} /><span className="text-xs text-muted">{r.date}</span></div>
                      <p className="mt-2 text-sm font-bold">{r.title}</p>
                      <p className="text-sm text-ink/80">{r.content}</p>
                      <p className="mt-1 text-xs text-muted">— {r.user}</p>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    /* ===================================================================
       JOBS
    =================================================================== */
    function Jobs() {
      return (
        <div className="mx-auto max-w-[1000px] px-4 py-6 md:px-6 fade-up">
          <div className="mb-6 rounded-2xl bg-gradient-to-r from-ink to-[#3a3f55] p-7 text-white">
            <span className="inline-flex items-center gap-1.5 rounded-full bg-brand/20 px-3 py-1 text-xs font-bold text-brand"><Briefcase size={13} /> CAREERS</span>
            <h1 className="mt-3 font-display text-3xl font-extrabold">Jobs on REEDBI</h1>
            <p className="mt-1 text-sm text-white/70">{JOBS.length} openings near you</p>
          </div>
          <div className="space-y-3">
            {JOBS.map(j=>(
              <div key={j.id} className="flex flex-col gap-3 rounded-xl bg-white p-5 shadow-soft sm:flex-row sm:items-center">
                <div className="grid h-12 w-12 place-items-center rounded-lg bg-brand/10 text-brand"><Briefcase size={22} /></div>
                <div className="flex-1">
                  <p className="font-bold">{j.title}</p>
                  <p className="text-sm text-muted">{j.company}</p>
                  <div className="mt-1.5 flex flex-wrap gap-2 text-xs text-muted">
                    <span className="flex items-center gap-1"><MapPin size={12} /> {j.location}</span>
                    <span className="flex items-center gap-1"><Clock size={12} /> {j.type}</span>
                    <span className="flex items-center gap-1"><CreditCard size={12} /> {j.salary}</span>
                  </div>
                </div>
                <button onClick={()=>alert('Demo: application form for '+j.title)} className="rounded-md bg-brand px-6 py-2.5 text-sm font-bold text-white">Apply</button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    /* ===================================================================
       ROUTER + APP
    =================================================================== */
    function Router() {
      const { route } = useStore();
      switch(route.name) {
        case 'products': return <Products />;
        case 'product': return <ProductDetail />;
        case 'cart': return <Cart />;
        case 'wishlist': return <Wishlist />;
        case 'account': return <Account />;
        case 'seller': return <Seller />;
        case 'jobs': return <Jobs />;
        default: return <Home />;
      }
    }

    function App() {
      return (
        <StoreProvider>
          <div className="flex min-h-screen flex-col">
            <Header />
            <main className="flex-1"><Router /></main>
            <Footer />
            <Toast />
          </div>
        </StoreProvider>
      );
    }

    createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
