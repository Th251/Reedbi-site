<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REEDBI — Complete E-commerce App</title>
<meta name="description" content="REEDBI — a complete single-file e-commerce app (home, shop, product, cart, wishlist, account).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   REEDBI — e-commerce website styles
   Custom design system, no framework.
============================================================ */
:root{
  --pink:#ff3f6c; --pink-dark:#e02e58; --accent:#0a8f6e;
  --ink:#1a1a1f; --ink-soft:#3a3a44; --muted:#8a8a93;
  --bg:#faf8f5; --surface:#ffffff; --line:#ece8e2; --line-2:#f4f1ec;
  --gold:#c79a3a; --radius:14px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(26,26,31,.04),0 8px 24px rgba(26,26,31,.06);
  --shadow-lg:0 12px 40px rgba(26,26,31,.12);
  --maxw:1280px;
  --display:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,sans-serif;
  --body:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer;border:none;background:none}
.container{max-width:var(--maxw);margin:0 auto;padding:0 24px}
.display{font-family:var(--display);font-weight:700;letter-spacing:-.02em;line-height:1.05}
.muted{color:var(--muted)}
.hide{display:none!important}

/* ---------- announcement bar ---------- */
.announce{background:var(--ink);color:#fff;text-align:center;font-size:12.5px;letter-spacing:.04em;padding:8px 16px;font-weight:500}
.announce b{color:var(--pink)}

/* ---------- header ---------- */
.site-header{position:sticky;top:0;z-index:100;background:rgba(250,248,245,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.header-row{display:flex;align-items:center;gap:28px;padding:16px 24px;max-width:var(--maxw);margin:0 auto}
.brand{font-family:var(--display);font-weight:800;font-size:25px;letter-spacing:-.04em;display:flex;align-items:center;gap:2px}
.brand .dot{color:var(--pink)}
.nav{display:flex;gap:26px;margin-left:8px}
.nav a{font-size:14px;font-weight:600;color:var(--ink-soft);position:relative;padding:6px 0;transition:color .2s}
.nav a::after{content:"";position:absolute;left:0;right:100%;bottom:0;height:2px;background:var(--pink);transition:right .25s ease}
.nav a:hover{color:var(--ink)}.nav a:hover::after,.nav a.active::after{right:0}
.nav a.active{color:var(--ink)}
.search{flex:1;max-width:420px;margin-left:auto;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:11px 44px 11px 18px;font-size:14px;font-family:inherit;outline:none;transition:border-color .2s,box-shadow .2s}
.search input:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,63,108,.12)}
.search button{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.icons{display:flex;align-items:center;gap:6px}
.icon-btn{position:relative;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--ink);transition:background .2s}
.icon-btn:hover{background:var(--line-2)}
.icon-btn svg{width:21px;height:21px}
.badge{position:absolute;top:4px;right:4px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--pink);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.burger{display:none}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14px;border-radius:999px;padding:13px 26px;transition:transform .15s,box-shadow .2s,background .2s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--pink);color:#fff}.btn-primary:hover{background:var(--pink-dark);box-shadow:0 8px 20px rgba(255,63,108,.3)}
.btn-dark{background:var(--ink);color:#fff}.btn-dark:hover{background:#000}
.btn-ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}.btn-ghost:hover{border-color:var(--ink)}
.btn-block{width:100%}
.btn-sm{padding:9px 16px;font-size:13px}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:0}
.hero-inner{max-width:var(--maxw);margin:0 auto;padding:64px 24px 56px;display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center}
.hero-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--pink);background:rgba(255,63,108,.1);padding:7px 14px;border-radius:999px}
.hero h1{font-size:clamp(40px,6vw,72px);margin:20px 0 18px}
.hero h1 em{font-style:italic;color:var(--pink)}
.hero p{font-size:18px;color:var(--ink-soft);max-width:440px;margin-bottom:28px}
.hero-cta{display:flex;gap:14px;flex-wrap:wrap}
.hero-stats{display:flex;gap:34px;margin-top:38px}
.hero-stats .n{font-family:var(--display);font-size:30px;font-weight:800}
.hero-stats .l{font-size:13px;color:var(--muted)}
.hero-art{position:relative;aspect-ratio:4/4.4;border-radius:24px;overflow:hidden;box-shadow:var(--shadow-lg)}
.hero-art img{width:100%;height:100%;object-fit:cover}
.hero-float{position:absolute;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-radius:14px;padding:12px 16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600}
.hero-float.tl{top:18px;left:18px}.hero-float.br{bottom:18px;right:18px}
.hero-float .pill{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--pink);color:#fff}

/* ---------- marquee categories ---------- */
.cat-strip{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface)}
.cat-strip .container{display:flex;gap:10px;overflow-x:auto;padding:16px 24px;scrollbar-width:none}
.cat-strip .container::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:9px 18px;font-size:13.5px;font-weight:600;color:var(--ink-soft);transition:all .2s}
.chip:hover,.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ---------- section heading ---------- */
.section{padding:56px 0}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:28px}
.sec-head h2{font-size:clamp(26px,3.4vw,38px)}
.sec-head p{color:var(--muted);font-size:15px;margin-top:4px}
.link-arrow{font-weight:700;font-size:14px;color:var(--ink);display:inline-flex;gap:6px;align-items:center;border-bottom:2px solid var(--pink);padding-bottom:2px}

/* ---------- product grid + card ---------- */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.grid.cols-3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:transform .25s,box-shadow .25s,border-color .25s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg);border-color:transparent}
.card-media{position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--line-2)}
.card-media img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.card:hover .card-media img{transform:scale(1.06)}
.card-media.oos img{filter:grayscale(1);opacity:.55}
.tag{position:absolute;top:12px;left:12px;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#fff;padding:5px 9px;border-radius:7px}
.tag.SALE{background:var(--pink)}.tag.NEW{background:var(--accent)}.tag.TRENDING{background:var(--ink)}
.wish{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.92);backdrop-filter:blur(4px);display:grid;place-items:center;box-shadow:var(--shadow);transition:transform .15s}
.wish:hover{transform:scale(1.1)}
.wish svg{width:18px;height:18px;color:var(--ink)}
.wish.on svg{fill:var(--pink);color:var(--pink)}
.oos-flag{position:absolute;inset:auto 0 0 0;background:rgba(26,26,31,.78);color:#fff;text-align:center;font-size:11px;font-weight:700;letter-spacing:.04em;padding:7px}
.card-body{padding:14px 15px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.card-brand{font-weight:700;font-size:14.5px}
.card-name{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rating{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--accent)}
.price{display:flex;align-items:baseline;gap:8px;margin-top:2px}
.price .now{font-weight:800;font-size:16px}
.price .was{font-size:13px;color:var(--muted);text-decoration:line-through}
.price .off{font-size:12.5px;font-weight:700;color:var(--pink)}
.card .btn{margin-top:auto}

/* ---------- page header / breadcrumb ---------- */
.page-head{padding:38px 0 8px}
.page-head h1{font-size:clamp(28px,4vw,42px)}
.crumb{font-size:13px;color:var(--muted);margin-bottom:6px}
.crumb a:hover{color:var(--pink)}

/* ---------- shop layout ---------- */
.shop{display:grid;grid-template-columns:248px 1fr;gap:34px;padding-bottom:64px}
.filters{position:sticky;top:96px;align-self:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.filters h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 10px}
.filters h3:first-child{margin-top:0}
.f-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.check{display:flex;align-items:center;gap:9px;font-size:14px;padding:5px 0;cursor:pointer;color:var(--ink-soft)}
.check input{accent-color:var(--pink);width:16px;height:16px}
.shop-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.shop-bar .count{font-size:14px;color:var(--muted)}
.select{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px;font-size:14px;font-weight:600;font-family:inherit;outline:none;cursor:pointer}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:80px 20px;text-align:center;color:var(--muted)}
.empty svg{width:46px;height:46px;margin:0 auto 12px;color:var(--line)}

/* ---------- product detail ---------- */
.pdp{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;padding:24px 0 64px}
.gallery{display:flex;gap:14px}
.thumbs{display:flex;flex-direction:column;gap:10px}
.thumbs img{width:62px;height:74px;object-fit:cover;border-radius:10px;border:2px solid transparent;cursor:pointer;opacity:.7;transition:.2s}
.thumbs img.active,.thumbs img:hover{border-color:var(--pink);opacity:1}
.stage{flex:1;border-radius:20px;overflow:hidden;background:var(--surface);border:1px solid var(--line);position:relative}
.stage img{width:100%;aspect-ratio:1;object-fit:cover}
.pdp-brand{font-size:20px;font-weight:800}
.pdp-name{font-size:18px;color:var(--muted);margin-top:2px}
.pdp .rating-lg{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;font-weight:700;font-size:13px;padding:3px 10px;border-radius:7px;margin-top:14px}
.pdp-price{display:flex;align-items:baseline;gap:12px;margin:18px 0 4px}
.pdp-price .now{font-family:var(--display);font-size:34px;font-weight:800}
.pdp-price .was{font-size:18px;color:var(--muted);text-decoration:line-through}
.pdp-price .off{font-size:18px;font-weight:700;color:var(--pink)}
.tax{color:var(--accent);font-weight:600;font-size:13.5px}
.sizes{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.size{min-width:48px;height:48px;padding:0 8px;border:1.5px solid var(--line);border-radius:50%;font-weight:700;font-size:14px;display:grid;place-items:center;transition:.2s;color:var(--ink)}
.size:hover{border-color:var(--ink)}
.size.sel{border-color:var(--pink);color:var(--pink);background:rgba(255,63,108,.07)}
.pdp-actions{display:flex;gap:12px;margin-top:26px}
.perks{margin-top:24px;border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:grid;gap:12px;background:var(--surface)}
.perk{display:flex;align-items:center;gap:12px;font-size:14px}
.perk svg{width:20px;height:20px;color:var(--accent);flex-shrink:0}
.specs{margin-top:14px;border-top:1px solid var(--line);padding-top:18px}
.specs h4{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px}
.spec-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.spec-row .k{color:var(--muted)}.spec-row .v{font-weight:600}

/* ---------- cart ---------- */
.cart-wrap{display:grid;grid-template-columns:1fr 360px;gap:30px;padding-bottom:64px;align-items:start}
.cart-item{display:flex;gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.cart-item.oos{opacity:.65}
.cart-item img{width:96px;height:120px;border-radius:10px;object-fit:cover;flex-shrink:0}
.cart-item .ci-body{flex:1;display:flex;flex-direction:column}
.ci-top{display:flex;justify-content:space-between;gap:10px}
.ci-meta{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:6px}
.ci-meta b{color:var(--ink)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px}
.qty button{width:34px;height:34px;display:grid;place-items:center;font-size:16px;color:var(--ink)}
.qty button:disabled{opacity:.35;cursor:not-allowed}
.qty span{min-width:30px;text-align:center;font-weight:700;font-size:14px}
.ci-bottom{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:10px;gap:10px}
.x-btn{color:var(--muted);width:30px;height:30px;display:grid;place-items:center;border-radius:50%}
.x-btn:hover{background:var(--line-2);color:var(--pink)}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;position:sticky;top:96px}
.summary h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:14px}
.sum-row{display:flex;justify-content:space-between;padding:7px 0;font-size:14px}
.sum-row .g{color:var(--accent);font-weight:700}
.sum-total{display:flex;justify-content:space-between;font-family:var(--display);font-weight:800;font-size:20px;padding:12px 0;border-top:1px solid var(--line);margin-top:6px}
.coupon{display:flex;gap:8px;margin-bottom:8px}
.coupon input{flex:1;border:1px solid var(--line);border-radius:999px;padding:11px 16px;font-size:14px;font-family:inherit;outline:none}
.coupon input:focus{border-color:var(--pink)}
.coupon-on{display:flex;align-items:center;justify-content:space-between;background:rgba(10,143,110,.08);border-radius:10px;padding:11px 14px;font-size:13.5px;font-weight:700;color:var(--accent)}
.steps{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 auto 30px;max-width:420px}
.step{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--muted)}
.step.on{color:var(--pink)}
.step .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--line);color:var(--ink)}
.step.on .n{background:var(--pink);color:#fff}
.step-line{width:38px;height:2px;background:var(--line)}
.state{text-align:center;padding:90px 20px}
.state .ico{width:96px;height:96px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;margin:0 auto 22px}
.state .ico svg{width:40px;height:40px;color:var(--muted)}
.state h2{font-size:26px;margin-bottom:8px}
.state p{color:var(--muted);margin-bottom:22px}

/* ---------- account ---------- */
.acct{display:grid;grid-template-columns:260px 1fr;gap:30px;padding-bottom:64px;align-items:start}
.acct-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.acct-profile{padding:24px;text-align:center;border-bottom:1px solid var(--line)}
.avatar{width:64px;height:64px;border-radius:50%;background:rgba(255,63,108,.12);color:var(--pink);display:grid;place-items:center;margin:0 auto 12px}
.avatar svg{width:30px;height:30px}
.acct-menu a{display:flex;align-items:center;gap:12px;padding:14px 20px;font-size:14px;font-weight:600;color:var(--ink-soft);border-bottom:1px solid var(--line-2);transition:.15s}
.acct-menu a:last-child{border-bottom:none}
.acct-menu a:hover{background:var(--line-2)}
.acct-menu a.active{color:var(--pink);background:rgba(255,63,108,.05)}
.acct-menu a svg{width:18px;height:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin-bottom:18px}
.welcome{background:linear-gradient(120deg,var(--ink),#34343f);color:#fff;border:none}
.welcome h2{font-size:26px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.stat .n{font-family:var(--display);font-size:26px;font-weight:800}
.stat .l{font-size:13px;color:var(--muted)}
.order{border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px}
.order-top{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:12px}
.order-status{font-weight:700}.order-status.ok{color:var(--accent)}.order-status.transit{color:var(--gold)}
.order-line{display:flex;align-items:center;gap:12px}
.order-line img{width:54px;height:64px;border-radius:8px;object-fit:cover}
.addr{border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px}
.addr .type{font-size:10px;font-weight:800;letter-spacing:.06em;background:var(--line-2);padding:3px 8px;border-radius:6px;text-transform:uppercase}
.addr .def{font-size:10px;font-weight:800;letter-spacing:.06em;background:rgba(10,143,110,.12);color:var(--accent);padding:3px 8px;border-radius:6px;text-transform:uppercase;margin-left:6px}

/* ---------- footer ---------- */
.site-footer{background:var(--ink);color:#cfcfd6;margin-top:40px}
.foot-trust{border-bottom:1px solid rgba(255,255,255,.08)}
.foot-trust .container{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;padding:34px 24px}
.trust{display:flex;align-items:center;gap:12px}
.trust .ic{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.06);display:grid;place-items:center;color:var(--pink)}
.trust .ic svg{width:20px;height:20px}
.trust .t{font-weight:700;color:#fff;font-size:14px}
.trust .d{font-size:12.5px;color:var(--muted)}
.foot-main{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:28px;padding:48px 24px;max-width:var(--maxw);margin:0 auto}
.foot-main .brand{color:#fff;margin-bottom:14px}
.foot-main p{font-size:14px;max-width:280px;color:var(--muted)}
.foot-col h4{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:#fff;margin-bottom:16px}
.foot-col a{display:block;font-size:14px;padding:5px 0;color:#cfcfd6;transition:.15s}
.foot-col a:hover{color:var(--pink)}
.foot-bottom{border-top:1px solid rgba(255,255,255,.08);text-align:center;padding:20px;font-size:13px;color:var(--muted)}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:14px 22px;border-radius:999px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:9px;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.3s;z-index:2000}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast svg{width:18px;height:18px;color:#5fe0b0}

/* ---------- reveal ---------- */
.reveal{opacity:0;transform:translateY(16px)}
.reveal.in{opacity:1;transform:none;transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.2,1)}

/* ---------- responsive ---------- */
@media(max-width:1000px){
  .hero-inner{grid-template-columns:1fr;gap:30px}
  .hero-art{max-width:420px}
  .pdp,.cart-wrap,.acct{grid-template-columns:1fr}
  .shop{grid-template-columns:1fr}
  .filters{position:static;display:none}
  .grid{grid-template-columns:repeat(3,1fr)}
  .foot-main{grid-template-columns:1fr 1fr}

/* ====== STORE ====== */
/* ============================================================
   REEDBI — store: cart + wishlist state (localStorage)
============================================================ */
const Store = (() => {
  const read = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
  const write = (k, v) => localStorage.setItem(k, JSON.stringify(v));

  let cart = read("reedbi_cart", []);      // [{id, qty, size}]
  let wish = read("reedbi_wish", []);      // [id]
  let coupon = read("reedbi_coupon", null);
  let gift = read("reedbi_gift", false);

  const save = () => { write("reedbi_cart", cart); write("reedbi_wish", wish); write("reedbi_coupon", coupon); write("reedbi_gift", gift); emit(); };
  const product = (id) => PRODUCTS.find((p) => p.id === id);

  const listeners = [];
  const on = (fn) => listeners.push(fn);
  const emit = () => listeners.forEach((fn) => fn());

  return {
    on,
    get cart() { return cart; },
    get wish() { return wish; },
    get coupon() { return coupon; },
    get gift() { return gift; },
    count() { return cart.reduce((s, i) => s + i.qty, 0); },
    wishCount() { return wish.length; },
    inWish(id) { return wish.includes(id); },

    add(id, size = null) {
      const p = product(id); if (!p || p.oos) return;
      size = size || (p.sizes ? p.sizes[0] : null);
      const found = cart.find((i) => i.id === id && i.size === size);
      if (found) found.qty = Math.min(found.qty + 1, p.stock);
      else cart.push({ id, qty: 1, size });
      save();
    },
    setQty(id, size, delta) {
      const p = product(id);
      const it = cart.find((i) => i.id === id && i.size === size);
      if (it) it.qty = Math.max(1, Math.min(it.qty + delta, p ? p.stock : 10));
      save();
    },
    remove(id, size) { cart = cart.filter((i) => !(i.id === id && i.size === size)); save(); },
    toggleWish(id) {
      if (wish.includes(id)) wish = wish.filter((x) => x !== id);
      else wish.push(id);
      save();
      return wish.includes(id);
    },
    applyCoupon(code) {
      code = (code || "").trim().toUpperCase();
      if (COUPONS[code]) { coupon = code; save(); return true; }
      return false;
    },
    removeCoupon() { coupon = null; save(); },
    toggleGift() { gift = !gift; save(); },
    clear() { cart = []; coupon = null; gift = false; save(); },

    detail() {
      return cart.map((i) => {
        const p = product(i.id);
        return p && { ...p, qty: i.qty, size: i.size, lineTotal: p.price * i.qty, lineMrp: p.mrp * i.qty };
      }).filter(Boolean);
    },
    totals() {
      const rows = this.detail().filter((r) => !r.oos);
      const totalMrp = rows.reduce((s, r) => s + r.lineMrp, 0);
      const subtotal = rows.reduce((s, r) => s + r.lineTotal, 0);
      const bagDiscount = totalMrp - subtotal;
      let couponDiscount = 0;
      if (coupon && COUPONS[coupon]) {
        const c = COUPONS[coupon];
        couponDiscount = c.type === "pct" ? Math.round(subtotal * c.v) : c.v;
      }
      const giftFee = gift ? 25 : 0;
      const shipping = subtotal > 500 ? 0 : (subtotal > 0 ? 49 : 0);
      const total = Math.max(0, subtotal - couponDiscount + shipping + giftFee);
      const items = rows.reduce((s, r) => s + r.qty, 0);
      return { totalMrp, subtotal, bagDiscount, couponDiscount, giftFee, shipping, total, items };
    },
  };
})();

function parseHash() {
  let h = location.hash.replace(/^#\/?/, "");          // e.g. "shop?q=watch"  or "product/3"

  const seg = path.split("/").filter(Boolean);          // ["product","3"]
  const params = new URLSearchParams(query || "");
  return { name: seg[0] || "home", arg: seg[1], params };
}

/* ---------- toast ---------- */
let toastEl;
function toast(msg) {
  if (!toastEl) { toastEl = document.createElement("div"); toastEl.className = "toast"; document.body.appendChild(toastEl); }
  toastEl.innerHTML = ICONS.check + "<span>" + msg + "</span>";
  toastEl.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => toastEl.classList.remove("show"), 2000);
}

/* ---------- product card ---------- */
function cardHTML(p) {
  return `<article class="card reveal">
    <div class="card-media ${p.oos ? "oos" : ""}">
      <a href="#/product/${p.id}"><img src="${p.image}" alt="${p.name}" loading="lazy"></a>
      ${p.tag ? `<span class="tag ${p.tag}">${p.tag}</span>` : ""}
      <button class="wish ${Store.inWish(p.id) ? "on" : ""}" data-wish="${p.id}" aria-label="Wishlist">${ICONS.heart}</button>
      ${p.oos ? `<span class="oos-flag">OUT OF STOCK</span>` : ""}
    </div>
    <div class="card-body">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span class="card-brand">${p.brand}</span><span class="rating">${p.rating} ${ICONS.spark}</span>
      </div>
      <a href="#/product/${p.id}" class="card-name">${p.name}</a>
      <div class="price"><span class="now">${INR(p.price)}</span><span class="was">${INR(p.mrp)}</span><span class="off">${p.off}% off</span></div>
      ${p.oos ? "" : `<button class="btn btn-ghost btn-sm" data-add="${p.id}">Add to Bag</button>`}
    </div></article>`;
}
function wireCards(scope = document) {
  $$("[data-add]", scope).forEach((b) => b.onclick = () => { Store.add(+b.dataset.add); toast("Added to bag"); });
  $$("[data-wish]", scope).forEach((b) => b.onclick = () => {
    const on = Store.toggleWish(+b.dataset.wish); b.classList.toggle("on", on);
    toast(on ? "Saved to wishlist" : "Removed from wishlist");
  });
  observeReveal(scope);
}
function observeReveal(scope = document) {
  if (!("IntersectionObserver" in window)) { $$(".reveal", scope).forEach((el)=>el.classList.add("in")); return; }
  const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .08 });
  $$(".reveal", scope).forEach((el) => io.observe(el));
}

      <strong>${it.brand}</strong><div class="muted" style="font-size:13px">${it.name}</div>
      <div class="ci-meta">${it.size?`<span>Size: <b>${it.size}</b></span>`:""}<span>Color: <b>${it.color}</b></span><span>Sold by ${it.seller}</span></div></div>
      <button class="x-btn" data-rm="${key}" aria-label="Remove">\u2715</button></div>
      ${it.oos?`<span style="margin-top:8px;color:var(--pink);font-weight:700;font-size:13px">Out of stock</span>`:`
      <div class="ci-bottom"><div style="display:flex;align-items:center;gap:14px">
        <div class="qty"><button data-dec="${key}" ${it.qty<=1?"disabled":""}>\u2212</button><span>${it.qty}</span><button data-inc="${key}" ${it.qty>=it.stock?"disabled":""}>+</button></div>
        <button data-wl="${key}" class="muted" style="font-size:12.5px;font-weight:700">Move to wishlist</button></div>
        <div style="text-align:right"><strong>${INR(it.lineTotal)}</strong><div class="muted" style="font-size:12px;text-decoration:line-through">${INR(it.lineMrp)}</div></div></div>`}
    </div></div>`;
}

/* ---------- router boot ---------- */
function route() {
  const { name, arg, params } = parseHash();
  const view = VIEWS[name] || VIEWS.home;
  setActiveNav(VIEWS[name] ? name : "home");
  view(arg, params);
  observeReveal();
  window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
}
window.addEventListener("hashchange", route);
document.addEventListener("DOMContentLoaded", () => { buildChrome(); route(); });
</script>
</body>
</html>
